# Fly.io (docs/DEPLOY.md). `fly launch --copy-config --no-deploy` names the
# app, then `fly deploy --ha=false` runs one machine: two would answer every
# DM twice. There is no web service, so nothing stops the machine when idle.

app = "bluesky-mod"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "bluesky_mod_data"
  destination = "/app/data"
  initial_size = "2gb"
  # Grows by itself before it fills, up to 10 GB.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "10GB"

# The web panel (docs/PANEL.md). Uncomment to give the bot an HTTPS address,
# and set PANEL_PORT=8787, PANEL_HOST=0.0.0.0 and PANEL_URL. "off" keeps Fly
# from stopping the machine when the panel is idle: the bot must keep running.
# [http_service]
#   internal_port = 8787
#   force_https = true
#   auto_stop_machines = "off"
#   auto_start_machines = false
#   min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
